apiVersion: demo.milan.dev/v1alpha1
kind: App
metadata:
  name: podinfo
  namespace: default
spec:
  activeColor: blue
  replicas: 1
  port: 9898
  blue:
    version: "1.0.0"
    image: stefanprodan/podinfo:6.15.0
    env:
      PODINFO_UI_MESSAGE: v1 served by blue
  green:
    version: "2.0.0"
    image: stefanprodan/podinfo:6.15.0
    env:
      PODINFO_UI_MESSAGE: v2 served by green
